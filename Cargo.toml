[workspace]
members = [
    "crates/klink-common",
    "crates/klink-parse",
    "crates/klink-graph",
    "crates/klink-index",
    "crates/klink-layout",
    "crates/klink-core",
    "crates/klink-cli",
]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ahash = "0.8"
aho-corasick = "1.1"
arc-swap = "1.7"
bytemuck = { version = "1.19", features = ["derive"] }
hashbrown = "0.15"
ignore = "0.4"
memmap2 = "0.9"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "pe", "macho"] }
rayon = "1.10"
redb = "2.1"
roaring = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
